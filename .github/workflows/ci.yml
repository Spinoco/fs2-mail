name: CI

on:
  push:
    branches: [ main, master, series/* ]
  pull_request:
    branches: [ main, master, series/* ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        scala: [2.12.20]
        java: [8, 11, 17, 21]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}

    - name: Setup sbt
      uses: sbt/setup-sbt@v1

    - name: Cache sbt
      uses: actions/cache@v4
      with:
        path: |
          ~/.sbt
          ~/.ivy2/cache
          ~/.coursier/cache/v1
          ~/.cache/coursier/v1
          target/
          project/target/
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
        restore-keys: |
          ${{ runner.os }}-sbt-
          
    - name: Compile
      run: sbt compile
      
    - name: Run tests
      run: sbt test